<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse</title>
    <link rel="icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h1>SnapLittlebear</h1>
        <a href="/" class="nav-btn">首页</a>
        <a href="/music.html" class="nav-btn">音乐播放器</a>
        <a href="/warehouse.html" class="nav-btn">仓库</a>
    </div>
    <div class="main-content">
    <h1>资源仓库</h1>
    
    <div class="file-list" id="fileList">
        <!-- 文件列表将动态加载到这里 -->
    </div>
    
    <div id="preview-container"></div>

    <script>
    // 动态加载 JSON 文件并渲染文件列表
    let fileManifest = [];
    
    function renderFileList() {
        const container = document.getElementById('fileList');
        container.innerHTML = '';
        fileManifest.forEach((file, index) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                ${file.name}
                <button onclick="previewFile(${index})">预览</button>
            `;
            container.appendChild(div);
        });
    }
    
    // 加载 warehouselist.json 并初始化 fileManifest
    fetch('/warehouse/list/warehouselist.json')
        .then(res => res.json())
        .then(data => {
            // 可选：拼接域名，若需外链可用如下方式
            // const domain = 'https://snaplittlebear.top';
            // fileManifest = data.filelist.map(f => ({...f, path: domain + f.path}));
            fileManifest = data.filelist;   
            renderFileList();
        })
        .catch(err => {
            console.error('文件列表加载失败', err);
            // 可选：降级为本地静态列表
        });
    
    // 预览功能保持不变
    function previewFile(index) {
        const file = fileManifest[index];
        const previewContainer = document.getElementById('preview-container');
        const file_url='//'+document.domain+file.path;
        let viewerHTML = '';
        switch(file.type) {
            case 'pdf':
                viewerHTML = `
                    <iframe 
                        src="https://alist-org.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(file_url)}"
                        width="100%" 
                        height="900px"
                        style="background: #fff;">
                    </iframe>`;
                break;
            case 'ppt':
            case 'pptx':
            case 'doc':
            case 'docx':
                viewerHTML = `
                    <iframe 
                        src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(file_url)}"
                        width="100%" 
                        height="900px" 
                        frameborder="0"
                        style="background: #fff;">
                    </iframe>`;
                break;
            // 可继续添加其他文件类型支持
        }
        previewContainer.innerHTML = `
            <button class="close-btn" onclick="this.parentElement.innerHTML=''">× 关闭预览</button>
            ${viewerHTML}
        `;
    }
    </script>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const images = [

                'background/alena-aenami-004.jpg',

                'background/alena-aenami-atlast2k2.jpg',
                'background/alena-aenami-away-1k.jpg',
                'background/alena-aenami-budapest.jpg',
                'background/alena-aenami-dreamer-1k.jpg',
                'background/alena-aenami-fade-1k.jpg',
                'background/alena-aenami-far-from-tomorrow-1080px.jpg',
                'background/alena-aenami-horizon-1k.jpg',
                'background/alena-aenami-imhere1k.jpg',
                'background/alena-aenami-lines1k.jpg',
                'background/alena-aenami-lost-1k.jpg',
                'background/alena-aenami-lunar-cover.jpg',
                'background/alena-aenami-million-little-pieces-1k.jpg',
                'background/alena-aenami-newwacom1-1-b-1k.jpg',
                'background/alena-aenami-night-1k.jpg',

        });
    </script>
    <button id="back-to-top" title="回到顶部">↑</button>
    <script>
        // Get the button
        let mybutton = document.getElementById("back-to-top");

        // When the user scrolls down 20px from the top of the document, show the button
        window.onscroll = function() {scrollFunction()};

        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        }

        // When the user clicks on the button, scroll to the top of the document
        mybutton.addEventListener('click', function() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        });
    </script>
</body>
</html>
