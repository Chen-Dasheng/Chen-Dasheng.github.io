<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="/musicplayer/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h1>SnapLittlebear</h1>
        <a href="/" class="nav-btn">首页</a>
        <a href="/music.html" class="nav-btn">音乐播放器</a>
        <a href="/warehouse.html" class="nav-btn">仓库</a>
    </div>
    <div class="main-content">
    <link rel="stylesheet" href="/musicplayer/dist/APlayer.min.css">
    <!-- 歌单选择下拉框 -->
    <span id="playlist-label">歌单</span>
    <select id="playlist-select">
        <option value="/musicplayer/list/web.json">web</option>
        <option value="/musicplayer/list/">null</option>
        <!-- 可根据实际歌单文件添加更多选项 -->
    </select>
    <div id="aplayer"></div>
    <script src="/musicplayer/dist/APlayer.min.js"></script>
    <script>
        let ap;

        // 初始化播放器
        function initPlayer(audioList) {
            if (ap) {
                ap.destroy();
            }
            ap = new APlayer({
                container: document.getElementById('aplayer'),
                mini: false,
                autoplay: false,
                theme: '#FADFA3',
                loop: 'all',
                order: 'random',
                preload: 'auto',
                volume: 0.7,
                mutex: true,
                listFolded: false,
                listMaxHeight: 90,
                lrcType: 3,
                audio: audioList
            });
        }

        // 加载歌单
        function loadPlaylist(filename) {
            fetch(`${filename}`)
                .then(res => res.json())
                .then(data => {
                    initPlayer(data.audio);
                });
        }

        // 监听下拉框变化
        document.getElementById('playlist-select').addEventListener('change', function() {
            loadPlaylist(this.value);
        });

        // 页面加载时默认加载第一个歌单
        loadPlaylist(document.getElementById('playlist-select').value);
    </script>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const images = [
                'background/alena-aenami-003.jpg',
                'background/alena-aenami-004.jpg',
                'background/alena-aenami-7p-m-1k.jpg',
                'background/alena-aenami-atlast2k2.jpg',
                'background/alena-aenami-away-1k.jpg',
                'background/alena-aenami-budapest.jpg',
                'background/alena-aenami-dreamer-1k.jpg',
                'background/alena-aenami-fade-1k.jpg',
                'background/alena-aenami-far-from-tomorrow-1080px.jpg',
                'background/alena-aenami-horizon-1k.jpg',
                'background/alena-aenami-imhere1k.jpg',
                'background/alena-aenami-lines1k.jpg',
                'background/alena-aenami-lost-1k.jpg',
                'background/alena-aenami-lunar-cover.jpg',
                'background/alena-aenami-million-little-pieces-1k.jpg',
                'background/alena-aenami-newwacom1-1-b-1k.jpg',
                'background/alena-aenami-night-1k.jpg',
                'background/alena-aenami-over-the-city1k.jpg',
                'background/alena-aenami-stay-1k.jpg',
                'background/waterReimu.jpg'
            ];
            const randomIndex = Math.floor(Math.random() * images.length);
            document.body.style.backgroundImage = `url('${images[randomIndex]}')`;
        });
    </script>
    <button id="back-to-top" title="回到顶部">↑</button>
    <script>
        // Get the button
        let mybutton = document.getElementById("back-to-top");

        // When the user scrolls down 20px from the top of the document, show the button
        window.onscroll = function() {scrollFunction()};

        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        }

        // When the user clicks on the button, scroll to the top of the document
        mybutton.addEventListener('click', function() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        });
    </script>
</body>
</html>
